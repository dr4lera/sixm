name: Build and release Sixm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Preview release tag
        required: true
        default: v0.2.0-preview

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and test Windows executables
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: build/release/*
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build, test and verify Mac DMG
        run: sh packaging/build_macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: build/Sixm-macOS-arm64.dmg
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || { echo 'Invalid release tag'; exit 1; }
          (cd release && sha256sum Sixm.exe SixmServer.exe Sixm-Windows-x64.zip Sixm-macOS-arm64.dmg > SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "Sixm $RELEASE_TAG" --notes-file packaging/RELEASE_NOTES.md --prerelease
          fi
